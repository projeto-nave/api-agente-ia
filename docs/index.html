<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nave - Agente de IA | Documentação</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f4f6f9;
      color: #1a1a2e;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 20px 32px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    header .logo {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #4f8ef7, #a259f7);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    header p {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 2px;
    }

    .badge {
      margin-left: auto;
      background: #4f8ef7;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }

    #swagger-ui {
      max-width: 1100px;
      margin: 32px auto;
      padding: 0 16px 60px;
    }

    /* Swagger UI overrides */
    .swagger-ui .topbar { display: none; }

    .swagger-ui .info {
      background: #fff;
      border-radius: 12px;
      padding: 24px 28px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      margin-bottom: 24px;
    }

    .swagger-ui .info .title {
      font-size: 26px !important;
      color: #1a1a2e !important;
    }

    .swagger-ui .info p {
      color: #475569 !important;
      font-size: 14px !important;
    }

    .swagger-ui .scheme-container {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      padding: 16px 24px;
      margin-bottom: 24px;
    }

    .swagger-ui .opblock-tag {
      border: none !important;
      font-size: 16px !important;
      font-weight: 600 !important;
      color: #1a1a2e !important;
      padding: 10px 4px !important;
      border-bottom: 2px solid #e2e8f0 !important;
      margin-bottom: 8px !important;
    }

    .swagger-ui .opblock {
      border-radius: 10px !important;
      border: none !important;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07) !important;
      margin-bottom: 8px !important;
      overflow: hidden;
    }

    .swagger-ui .opblock .opblock-summary {
      border-radius: 10px !important;
    }

    .swagger-ui .opblock.opblock-post .opblock-summary { background: #f0f7ff !important; border-left: 4px solid #4f8ef7 !important; }
    .swagger-ui .opblock.opblock-get  .opblock-summary { background: #f0fff8 !important; border-left: 4px solid #22c55e !important; }
    .swagger-ui .opblock.opblock-delete .opblock-summary { background: #fff5f5 !important; border-left: 4px solid #ef4444 !important; }
    .swagger-ui .opblock.opblock-put    .opblock-summary { background: #fffbeb !important; border-left: 4px solid #f59e0b !important; }
    .swagger-ui .opblock.opblock-patch  .opblock-summary { background: #faf5ff !important; border-left: 4px solid #a259f7 !important; }

    .swagger-ui .btn.authorize {
      background: #4f8ef7 !important;
      color: #fff !important;
      border: none !important;
      border-radius: 8px !important;
    }

    .swagger-ui .btn.execute {
      background: #1a1a2e !important;
      border-radius: 8px !important;
    }

    .swagger-ui select, .swagger-ui input[type=text], .swagger-ui textarea {
      border-radius: 6px !important;
      border: 1px solid #cbd5e1 !important;
    }

    .swagger-ui .response-col_status { font-weight: 600 !important; }

    footer {
      text-align: center;
      padding: 24px;
      font-size: 12px;
      color: #94a3b8;
      border-top: 1px solid #e2e8f0;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">🚀</div>
    <div>
      <h1>Nave — Agente de IA</h1>
      <p>Documentação interativa da API REST</p>
    </div>
    <span class="badge">v1.0.0</span>
  </header>

  <div id="swagger-ui"></div>

  <footer>
    Naves do Conhecimento · Prefeitura do Rio de Janeiro
  </footer>

  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    window.onload = () => {
      SwaggerUIBundle({
        url: './openapi.json',
        dom_id: '#swagger-ui',
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIBundle.SwaggerUIStandalonePreset
        ],
        layout: 'BaseLayout',
        deepLinking: true,
        displayRequestDuration: true,
        defaultModelsExpandDepth: 1,
        defaultModelExpandDepth: 1,
        docExpansion: 'list',
        filter: true,
        tryItOutEnabled: false,
      });
    };
  </script>
</body>
</html>
