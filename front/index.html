<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nave do Conhecimento | Site Fictício</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css">
  </head>

  <body>
  
    <header>
      <h2>Nave do Conhecimento</h2>
      <div style="display:flex; align-items:center; gap:8px;">
        <button class="btn-login" id="openLogin">Acessar Conta</button>
        <!-- Botão de logout: oculto por padrão, exibido via JS após login -->
        <button class="btn-login" id="logoutBtn" style="display:none; background:#dc3545;">Sair</button>
      </div>
    </header>

    <section class="banner">
      <div>
        <h1>Bem-vindo à Plataforma de Aprendizado</h1>
        <p>Explore cursos, tecnologias e impulsione sua carreira.</p>
      </div>
    </section>

    <!-- Modal de Login -->
    <div class="modal-overlay" id="loginModal">
      <div class="modal-content">
        <button class="modal-close" id="closeLogin">&times;</button>
        <h3>Entrar na Plataforma</h3>
        <br>
        <form id="formLogin">
          <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" required placeholder="seu@email.com" autocomplete="username">
          </div>
          <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" required placeholder="Sua senha" autocomplete="current-password">
          </div>
          <button type="submit" class="btn-submit">Entrar</button>
          <!-- Mensagem de erro injetada aqui pelo JS -->
        </form>
      </div>
    </div>

    <!-- Chat Flutuante -->
    <div class="chat-totem">
      <div class="chat-box" id="chatBox">
        <div class="chat-header">
          <span>Agente IA</span>
          <span style="cursor:pointer" id="minimizeChat">_</span>
        </div>
        <div class="chat-messages" id="chatMessages">
          <p><strong>IA:</strong> Olá! Como posso te ajudar hoje?</p>
        </div>
        <div class="chat-input-area">
          <input type="text" id="chatInput" placeholder="Digite sua mensagem...">
          <button id="sendChat">Enviar</button>
        </div>
      </div>

      <button class="chat-button" id="toggleChat">
        💬 Conversar com IA
      </button>
    </div>

    <!-- Ajuste o caminho conforme a estrutura do seu servidor -->
    <script src="js/script.js"></script>
  </body>
</html>
