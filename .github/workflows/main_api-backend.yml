name: Build and deploy Python app to Azure Web App - api-backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # Use 3.11 para compatibilidade

      - name: Create startup.sh
        run: |
          cat > startup.sh << 'EOF'
          #!/bin/bash
          echo "Instalando dependências..."
          pip install --no-cache-dir -r requirements.txt
          echo "Iniciando aplicação..."
          uvicorn main:app --host 0.0.0.0 --port 8000
          EOF
          chmod +x startup.sh

      - name: Upgrade pip and install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Verify installation
        run: |
          python -c "import fastapi; print('✅ FastAPI OK')"
          python -c "import uvicorn; print('✅ Uvicorn OK')"
          python -c "import main; print('✅ Main module OK')" || echo "⚠️ Main module not found"

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !__pycache__/
            !**/__pycache__/
            !*.pyc
            !antenv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
      
      - name: List files (debug)
        run: ls -la
      
      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'api-backend'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_1F27027E8FAC44579E1E8C8985237617 }}
