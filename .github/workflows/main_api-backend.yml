# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - api-backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # Mudei para 3.11 (mais estável)

      - name: Create and start virtual environment
        run: |
          python -m venv antenv
          source antenv/bin/activate
          python -m pip install --upgrade pip  # ATUALIZA O PIP PRIMEIRO

      - name: Install dependencies
        run: |
          source antenv/bin/activate
          # Instala em etapas para identificar erros
          pip install --no-cache-dir \
            fastapi \
            uvicorn[standard] \
            sqlalchemy \
            pymysql \
            cryptography \
            python-dotenv \
            httpx \
            alembic \
            passlib[bcrypt] \
            bcrypt \
            python-jose[cryptography] \
            python-multipart
          
          # Se você precisar do langchain-azure-ai, instale separadamente
          # pip install langchain-azure-ai

      - name: Verify installation
        run: |
          source antenv/bin/activate
          python -c "import fastapi; print('FastAPI installed successfully')"
          python -c "import uvicorn; print('Uvicorn installed successfully')"

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/
            !__pycache__/
            !**/__pycache__/
            !*.pyc

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
      
      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'api-backend'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_1F27027E8FAC44579E1E8C8985237617 }}
         
